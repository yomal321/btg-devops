name: Deploy Dashboard to Vercel

# Automates what has been a manual `vercel --prod` deploy until now — a push
# to production with dashboard changes now deploys itself instead of relying
# on someone remembering to run the CLI. VERCEL_ORG_ID/VERCEL_PROJECT_ID
# aren't secret (they're plain project identifiers, already visible in
# dashboard/.vercel/project.json which is gitignored per-machine) but are
# passed as repo secrets anyway so this workflow doesn't hardcode them.
on:
  push:
    branches: [production]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    # No working-directory default: the Vercel CLI must be invoked from the
    # monorepo ROOT, not from inside dashboard/. The project's own Root
    # Directory setting (Settings -> Build and Deployment -> "dashboard")
    # is what tells `vercel build`/`vercel deploy` to descend into the
    # dashboard folder — running the CLI already cd'd into dashboard/ on top
    # of that setting makes it look for a nonexistent dashboard/dashboard.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
