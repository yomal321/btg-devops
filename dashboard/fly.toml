# Fly.io app for mcp-server only (spec 8). Deploy with `fly deploy` from
# this directory. Before first deploy, set the secrets Fly should never see
# committed to git:
#   fly secrets set MCP_BEARER_TOKEN=<generate a long random value>
#   fly secrets set DATABASE_URL=<same Postgres URL the dashboard uses>
#
# app name is a placeholder — rename before first `fly launch`/`fly deploy`.
app = "btg-devops-mcp"
primary_region = "sin"

[build]

[env]
  MCP_HOST = "0.0.0.0"
  MCP_PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
